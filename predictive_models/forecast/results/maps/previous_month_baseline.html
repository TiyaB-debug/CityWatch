const el = id => document.getElementById(id);
el("title").textContent = data.label;
el("preview").src = "../figures/" + data.id + ".png";
el("provenance").textContent = data.weather + " · Manhattan borough";
el("day").add(new Option("All scenario days","all"));
for (const day of Object.keys(data.days)) el("day").add(new Option(day,day));
let map, info, marks = [];

function explain(place) {
  return data.baseline ? place.score+" prior-month injury collisions"
    : place.score.toFixed(2)+" expected collisions over "+place.days+" matching days";
}
function show(place) {
  if (!map) {
    el("status").textContent = "Cell "+place.id+" · "+explain(place)+". Load Google Maps to see it on the map.";
    return;
  }
  const position = {lat:place.lat,lng:place.lon};
  map.panTo(position);
  const details = document.createElement("div");
  details.textContent = "Cell "+place.id+" · "+explain(place);
  info.setContent(details);
  info.setPosition(position);
  info.open({map});
}
function draw() {
  for (const marker of marks) marker.setMap(null);
  marks = [];
  el("ranking").replaceChildren();
  const day = el("day").value, weather = el("weather").value;
  const dates = day === "all" ? Object.keys(data.days) : [day];
  const bounds = map && map.getBounds();
  const shortlist = data.cells.flatMap(([id,lat,lon,prior],index) => {
    if (el("viewport").checked && bounds && !bounds.contains({lat,lng:lon})) return [];
    const conditions = dates.map(date=>data.days[date][index]).filter(row =>
      weather === "all" || (weather === "wet" ? row[0] >= 1 : row[0] < 1));
    if (!conditions.length) return [];
    const score = data.baseline ? prior : conditions.reduce((sum,row)=>sum+row[2],0);
    const meanRain = conditions.reduce((sum,row)=>sum+row[0],0)/conditions.length;
    const meanTemp = conditions.reduce((sum,row)=>sum+row[1],0)/conditions.length;
    return [{id,lat,lon,prior,score,meanRain,meanTemp,days:conditions.length}];
  }).sort((a,b)=>b.score-a.score).slice(0,Number(el("budget").value));
  el("summary").textContent = shortlist.length + " cells · approximately 500 m each";
  shortlist.forEach(place => {
    const {lat,lon} = place;
    if (map) {
      const rectangle = new google.maps.Rectangle({map,
        bounds:{south:lat-.00225,west:lon-.00295,north:lat+.00225,east:lon+.00295},
        strokeColor:"#087e84",strokeWeight:2,fillColor:"#087e84",fillOpacity:.35});
      rectangle.addListener("click",()=>show(place));
      marks.push(rectangle);
    }
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.textContent = "Cell " + place.id;
    button.onclick = () => show(place);
    item.append(button, document.createElement("br"), explain(place) +
      (data.baseline ? "" : " · " + place.prior + " prior-month collisions") +
      " · " + place.meanRain.toFixed(1) + " mm/day · " + place.meanTemp.toFixed(1) + " °C");
    el("ranking").append(item);
  });
}
window.initCityWatchMap = () => {
  el("map").hidden = false;
  el("preview").hidden = true;
  map = new google.maps.Map(el("map"),{center:{lat:40.783,lng:-73.966},zoom:12,
    restriction:{latLngBounds:{south:40.68,west:-74.05,north:40.90,east:-73.89},strictBounds:false},
    streetViewControl:false,mapTypeControl:false});
  info = new google.maps.InfoWindow();
  el("viewport").disabled = false;
  el("status").textContent = "Google Maps connected. Select a cell to see its estimate.";
  map.addListener("idle",()=>{if(el("viewport").checked)draw();});
  draw();
};
function fail(message) {
  el("status").textContent = message;
  el("map").hidden = true;
  el("preview").hidden = false;
  el("viewport").checked = false;
  el("viewport").disabled = true;
  map = undefined;
  draw();
}
window.gm_authFailure = () => fail("Google rejected the key. Check the API, billing, and allowed referrers, then reload this page.");
el("connect").addEventListener("submit",event=>{
  event.preventDefault();
  const key = el("key").value.trim();
  if (!key) return;
  el("load").disabled = true;
  el("key").value = "";
  el("key").disabled = true;
  el("status").textContent = "Connecting to Google Maps…";
  const script = document.createElement("script");
  const query = new URLSearchParams({key,loading:"async",callback:"initCityWatchMap",v:"quarterly"});
  script.src = "https://maps.googleapis.com/maps/api/js?" + query;
  script.async = true;
  script.onerror = () => { script.remove(); el("load").disabled=false; el("key").disabled=false;
    fail("Google Maps could not load. Check your connection and retry."); };
  document.head.append(script);
});
document.querySelector(".controls").addEventListener("change",draw);
draw();
</script>
